[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadlp"
version = "1.0.0"
description = "Context-Aware Data Loss Prevention Proxy for Large Language Models"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "CADLP Research Team", email = "research@cadlp.io" }]
requires-python = ">=3.9"
keywords = ["DLP", "LLM", "security", "privacy", "proxy", "NLP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
full = [
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "httpx>=0.27",
]

[project.scripts]
cadlp = "cadlp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cadlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
